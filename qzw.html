<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>千字文小博士挑战</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #FFD7E9 0%, #B2E2FF 100%);
      font-family: 'Comic Sans MS', cursive;
    }
    #container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .counter {
      font-size: 2.5em;
      color: #FF6B6B;
      margin: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    .character-box {
      width: 80%;
      height: 50vh;
      background: white;
      border-radius: 30px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      margin: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .character {
      font-size: 15em;
      color: #4ECDC4;
      transition: transform 0.3s;
      animation: bounce 1s infinite alternate;
    }
    .buttons {
      position: absolute;
      bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
    }
    .btn {
      width: 150px;
      height: 150px;
      border: none;
      border-radius: 50%;
      font-size: 4em;
      cursor: pointer;
      transition: transform 0.2s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    #wrongBtn {
      background: #FF6B6B;
      color: white;
    }
    #rightBtn {
      background: #77DD77;
      color: white;
    }
    .result {
      font-size: 3em;
      text-align: center;
      padding: 30px;
      color: #4A90E2;
    }
    @keyframes bounce {
      from { transform: translateY(-10px); }
      to { transform: translateY(10px); }
    }
  </style>
</head>
<body>
<div id="container">
  <div class="counter">认识：<span id="correct">0</span>/已测：<span id="total">0</span></div>
  <div class="character-box">
    <div class="character" id="currentChar">?</div>
  </div>
  <div class="buttons">
    <button class="btn" id="wrongBtn">❌</button>
    <button class="btn" id="rightBtn">✅</button>
  </div>
  <div id="result" class="result"></div>
</div>

<script>
  // 千字文文本
  let qianziwen = `天地玄黄，宇宙洪荒。日月盈昃，辰宿列张。
寒来暑往，秋收冬藏。闰余成岁，律吕调阳。
云腾致雨，露结为霜。金生丽水，玉出昆冈。
剑号巨阙，珠称夜光。果珍李柰，菜重芥姜。
海咸河淡，鳞潜羽翔。龙师火帝，鸟官人皇。
始制文字，乃服衣裳。推位让国，有虞陶唐。
吊民伐罪，周发殷汤。坐朝问道，垂拱平章。
爱育黎首，臣伏戎羌。遐迩一体，率宾归王。
鸣凤在竹，白驹食场。化被草木，赖及万方。
盖此身发，四大五常。恭惟鞠养，岂敢毁伤。
女慕贞洁，男效才良。知过必改，得能莫忘。
罔谈彼短，靡恃己长。信使可覆，器欲难量。
墨悲丝染，诗赞羔羊。景行维贤，克念作圣。
德建名立，形端表正。空谷传声，虚堂习听。
祸因恶积，福缘善庆。尺璧非宝，寸阴是竞。
资父事君，曰严与敬。孝当竭力，忠则尽命。
临深履薄，夙兴温凊。似兰斯馨，如松之盛。
川流不息，渊澄取映。容止若思，言辞安定。
笃初诚美，慎终宜令。荣业所基，籍甚无竟。
学优登仕，摄职从政。存以甘棠，去而益咏。
乐殊贵贱，礼别尊卑。上和下睦，夫唱妇随。
外受傅训，入奉母仪。诸姑伯叔，犹子比儿。
孔怀兄弟，同气连枝。交友投分，切磨箴规。
仁慈隐恻，造次弗离。节义廉退，颠沛匪亏。
性静情逸，心动神疲。守真志满，逐物意移。
坚持雅操，好爵自縻。都邑华夏，东西二京。
背邙面洛，浮渭据泾。宫殿盘郁，楼观飞惊。
图写禽兽，画彩仙灵。丙舍旁启，甲帐对楹。
肆筵设席，鼓瑟吹笙。升阶纳陛，弁转疑星。
右通广内，左达承明。既集坟典，亦聚群英。
杜稿钟隶，漆书壁经。府罗将相，路侠槐卿。
户封八县，家给千兵。高冠陪辇，驱毂振缨。
世禄侈富，车驾肥轻。策功茂实，勒碑刻铭。
磻溪伊尹，佐时阿衡。奄宅曲阜，微旦孰营。
桓公匡合，济弱扶倾。绮回汉惠，说感武丁。
俊乂密勿，多士实宁。晋楚更霸，赵魏困横。
假途灭虢，践土会盟。何遵约法，韩弊烦刑。
起翦颇牧，用军最精。宣威沙漠，驰誉丹青。
九州禹迹，百郡秦并。岳宗泰岱，禅主云亭。
雁门紫塞，鸡田赤城。昆池碣石，钜野洞庭。
旷远绵邈，岩岫杳冥。治本于农，务兹稼穑。
俶载南亩，我艺黍稷。税熟贡新，劝赏黜陟。
孟轲敦素，史鱼秉直。庶几中庸，劳谦谨敕。
聆音察理，鉴貌辨色。贻厥嘉猷，勉其祗植。
省躬讥诫，宠增抗极。殆辱近耻，林皋幸即。
两疏见机，解组谁逼。索居闲处，沉默寂寥。
求古寻论，散虑逍遥。欣奏累遣，戚谢欢招。
渠荷的历，园莽抽条。枇杷晚翠，梧桐蚤凋。
陈根委翳，落叶飘摇。游鹍独运，凌摩绛霄。
耽读玩市，寓目囊箱。易輶攸畏，属耳垣墙。
具膳餐饭，适口充肠。饱饫烹宰，饥厌糟糠。
亲戚故旧，老少异粮。妾御绩纺，侍巾帷房。
纨扇圆絜，银烛炜煌。昼眠夕寐，蓝笋象床。
弦歌酒宴，接杯举觞。矫手顿足，悦豫且康。
嫡后嗣续，祭祀烝尝。稽颡再拜，悚惧恐惶。
笺牒简要，顾答审详。骸垢想浴，执热愿凉。
驴骡犊特，骇跃超骧。诛斩贼盗，捕获叛亡。
布射僚丸，嵇琴阮啸。恬笔伦纸，钧巧任钓。
释纷利俗，并皆佳妙。毛施淑姿，工颦妍笑。
年矢每催，曦晖朗曜。璇玑悬斡，晦魄环照。
指薪修祜，永绥吉劭。矩步引领，俯仰廊庙。
束带矜庄，徘徊瞻眺。孤陋寡闻，愚蒙等诮。
谓语助者，焉哉乎也。`.split('');
//去除标点和换行符
  qianziwen = qianziwen.filter(char => char.trim() !== '' && !['，', '。', '、', '；', '：', '“', '”', '（', '）'].includes(char));
  let characters = [];
  let currentIndex = 0;
  let correctCount = 0;

  // 初始化游戏
  function initGame() {
    // 加载存储的进度
    const savedProgress = JSON.parse(localStorage.getItem('progress')) || { knownCharacters: [], unknownCharacters: [] };
    let knownCharacters = [];
    let unknownCharacters = [];

    if (savedProgress) {
      knownCharacters = savedProgress.knownCharacters || [];
      unknownCharacters = savedProgress.unknownCharacters || [];
    }

    // 从千字文中移除已认识和未认识的字
    characters = qianziwen.filter(char => !knownCharacters.includes(char) && !unknownCharacters.includes(char));

    // 如果没有剩余字，重新开始
    if (characters.length === 0) {
      localStorage.removeItem('progress');
      characters = [...qianziwen];
      knownCharacters = [];
      unknownCharacters = [];
    }

    // 打乱顺序（Fisher-Yates算法）
    for (let i = characters.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [characters[i], characters[j]] = [characters[j], characters[i]];
    }

    currentIndex = 0;
    correctCount = knownCharacters.length;

    // 设置已测数量
    const testedCount = knownCharacters.length + unknownCharacters.length;
    document.getElementById('total').textContent = testedCount;

    // 显示第一个字
    showNextCharacter();

    // 保存初始化后的状态
    localStorage.setItem('progress', JSON.stringify({
      knownCharacters: knownCharacters,
      unknownCharacters: unknownCharacters
    }));
  }

  // 显示下一个字
  function showNextCharacter() {
    if (currentIndex >= characters.length) {
      showResult();
      return;
    }
    const currentChar = characters[currentIndex];
    document.getElementById('currentChar').textContent = currentChar;

    // 更新已测数量
    const savedProgress = JSON.parse(localStorage.getItem('progress'));
    const testedCount = (savedProgress.knownCharacters || []).length + (savedProgress.unknownCharacters || []).length;
    document.getElementById('total').textContent = testedCount;

    document.getElementById('correct').textContent = correctCount;
  }
  // 处理答案
  function handleAnswer(isCorrect) {
    const currentChar = characters[currentIndex];

    // 加载存储的进度
    const savedProgress = JSON.parse(localStorage.getItem('progress'));
    const knownCharacters = savedProgress.knownCharacters || [];
    const unknownCharacters = savedProgress.unknownCharacters || [];

    if (isCorrect) {
      correctCount++;
      knownCharacters.push(currentChar);
    } else {
      unknownCharacters.push(currentChar);
    }

    currentIndex++;

    // 存储更新后的进度
    localStorage.setItem('progress', JSON.stringify({
      knownCharacters: knownCharacters,
      unknownCharacters: unknownCharacters
    }));

    // 添加点击动画
    document.getElementById('currentChar').style.transform = 'scale(0.9)';
    setTimeout(() => {
      document.getElementById('currentChar').style.transform = 'scale(1)';
      showNextCharacter();
    }, 200);
  }

  // 显示最终结果
  function showResult() {
    // 清除存储的进度
    localStorage.removeItem('progress');

    document.getElementById('container').innerHTML = `
        <div class="result">
            <div style="font-size:1.5em">🎉 挑战完成 🎉</div>
            <div>认识字数：${correctCount}</div>
            <div style="font-size:0.8em; margin-top:20px">点击屏幕重新开始</div>
        </div>
    `;
    document.getElementById('container').onclick = initGame;
  }

  // 事件监听
  document.getElementById('wrongBtn').addEventListener('click', () => handleAnswer(false));
  document.getElementById('rightBtn').addEventListener('click', () => handleAnswer(true));

  // 启动游戏
  initGame();
</script>
</body>
</html>
